<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💖 Valentine Quest for Dilusha 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
    }

    .energy {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 60%);
      animation: pulse 4s infinite alternate;
      z-index: 0;
    }

    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 0.9; }
    }

    .card {
      background: rgba(0,0,0,0.75);
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
      text-align: center;
      max-width: 380px;
      width: 90%;
      z-index: 2;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 { color: #ff7aa2; }
    p { color: #ddd; }

    input {
      padding: 14px;
      width: 100%;
      border-radius: 14px;
      border: none;
      margin-top: 14px;
      font-size: 15px;
      outline: none;
    }

    button {
      margin-top: 20px;
      padding: 14px 30px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff4d6d, #ff9a9e);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.07);
      box-shadow: 0 0 20px rgba(255,100,150,0.8);
    }

    .hidden { display: none; }

    /* Page 2 */
    .page2 {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .character {
      width: 220px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255,200,200,0.4);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* Popup */
    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none; /* FORCE HIDDEN */
      justify-content: center;
      align-items: center;
      z-index: 5;
    }

    .popup-content {
      background: white;
      color: #333;
      padding: 30px;
      border-radius: 26px;
      text-align: center;
      max-width: 340px;
      animation: pop 0.45s ease;
    }

    @keyframes pop {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .popup-content h1 { color: #ff4d6d; }
  </style>
</head>
<body>

  <div class="energy"></div>

  <!-- PAGE 1: PASSWORD -->
  <div class="card" id="page1">
    <h1>🔒 Secret Quest 🔒</h1>
    <p>Hint: the first event name we first met 😉</p>
    <input type="password" id="password" placeholder="Enter the secret word" />
    <button onclick="unlock()">Unlock 💖</button>
  </div>

  <!-- PAGE 2: SURPRISE -->
  <div class="card hidden page2" id="page2">
    <h1>Hi Dilusha 💕</h1>
    <p>This is me… in my anime universe 🌸</p>
    <img class="character" src="anime-me.png" alt="Anime Me" />
    <button onclick="showPopup()">Continue ✨</button>
  </div>

  <!-- POPUP QUESTION -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <h1>Dilusha 💖</h1>
      <p>Will you be my Valentine?</p>
      <button onclick="yesClicked()">YES 😍🔥</button>
    </div>
  </div>

  <script>
    const SECRET = "omg";

    function unlock() {
      const input = document.getElementById('password').value.toLowerCase();
      if (input === SECRET) {
        document.getElementById('page1').classList.add('hidden');
        document.getElementById('page2').classList.remove('hidden');
      } else {
        alert('Wrong answer 😜 Try again!');
      }
    }

    function showPopup() {
      document.getElementById('popup').style.display = 'flex';
    }

    function yesClicked() {
      alert('💘 POWER LEVEL: INFINITE 💘');
    }
  </script>

</body>
</html>
