<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>💖 Valentine Quest for Dilusha 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: white;
}

.energy {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 60%);
  animation: pulse 4s infinite alternate;
}

@keyframes pulse {
  from { opacity: 0.4; }
  to { opacity: 0.9; }
}

.card {
  background: rgba(0,0,0,0.75);
  padding: 32px;
  border-radius: 24px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.6);
  text-align: center;
  max-width: 380px;
  width: 90%;
  z-index: 2;
}

h1 { color: #ff7aa2; }
p { color: #ddd; }

button {
  margin-top: 15px;
  padding: 14px 30px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #ff4d6d, #ff9a9e);
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.hidden { display: none; }

.popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 5;
}

.popup-content {
  background: white;
  color: #333;
  padding: 30px;
  border-radius: 26px;
  text-align: center;
  max-width: 340px;
}

.popup-content h1 {
  color: #ff4d6d;
}

.popup-buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
}

#fireworksCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 10;
}
</style>
</head>

<body>

<div class="energy"></div>
<canvas id="fireworksCanvas"></canvas>

<div class="card">
  <h1>💌 Question Time 💌</h1>
  <p>Are you ready? 😌</p>
  <button onclick="openPopup()">Continue ✨</button>
</div>

<!-- VALENTINE POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h1>Dilusha 💖</h1>
    <p id="questionText">Will you be my Valentine?</p>

    <div class="popup-buttons" id="buttons">
      <button onclick="yesClicked()">YES 😍</button>
      <button onclick="noClicked()">NO 😏</button>
    </div>
  </div>
</div>

<script>
function openPopup() {
  document.getElementById('popup').style.display = 'flex';
}

function noClicked() {
  document.getElementById('questionText').innerText =
    "Hmm… wrong answer 😌 Try again 💕";
  document.getElementById('buttons').innerHTML =
    `<button onclick="yesClicked()">OKAY YES 😍🔥</button>`;
}

// FINAL YES + FIREWORKS
function yesClicked() {
  document.getElementById('questionText').innerHTML =
    "🎉 YEAHHHHHH!! 🎉<br><br>I KNEW you’d say YES 💖";
  document.getElementById('buttons').innerHTML = "";

  startFireworks();
}

// FIREWORKS
function startFireworks() {
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];

  function createFirework(x, y) {
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * 2 * Math.PI;
      const speed = Math.random() * 6 + 2;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        color: `hsl(${Math.random()*360},100%,50%)`
      });
    }
  }

  function animate() {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, i) => {
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.02;

      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();

      if (p.alpha <= 0) particles.splice(i, 1);
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  animate();

  let count = 0;
  const interval = setInterval(() => {
    createFirework(
      Math.random() * canvas.width,
      Math.random() * canvas.height / 2
    );
    count++;
    if (count > 20) clearInterval(interval);
  }, 300);
}
</script>

</body>
</html>
