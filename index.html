<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Valentine Quest 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: white;
}

.card {
  background: rgba(0,0,0,0.75);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  z-index: 2;
}

button {
  margin: 10px;
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #ff4d6d, #ff9a9e);
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 5;
}

.popup-content {
  background: white;
  color: #333;
  padding: 30px;
  border-radius: 25px;
  text-align: center;
  max-width: 320px;
}

.popup-content h1 {
  color: #ff4d6d;
}

#fireworksCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 10;
}
</style>
</head>

<body>

<canvas id="fireworksCanvas"></canvas>

<div class="card">
  <h1>💌 Question Time 💌</h1>
  <p>Click when ready 😌</p>
  <button onclick="openPopup()">Continue ✨</button>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h1>Dilusha 💖</h1>
    <p id="question">Will you be my Valentine?</p>
    <div id="answers">
      <button onclick="yes()">YES 😍</button>
      <button onclick="no()">NO 😏</button>
    </div>
  </div>
</div>

<script>
function openPopup() {
  document.getElementById("popup").style.display = "flex";
}

function no() {
  document.getElementById("question").innerText =
    "Oops 😌 Wrong answer. Try again 💕";
  document.getElementById("answers").innerHTML =
    `<button onclick="yes()">OKAY YES 😍🔥</button>`;
}

function yes() {
  document.getElementById("question").innerHTML =
    "🎉 YEAHHHHHH!! 🎉<br><br>I KNEW you’d say YES 💖";
  document.getElementById("answers").innerHTML = "";
  startFireworks();
}

// FIREWORKS (GUARANTEED)
function startFireworks() {
  const canvas = document.getElementById("fireworksCanvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];

  function createFirework() {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height / 2;
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color: `hsl(${Math.random()*360},100%,50%)`
      });
    }
  }

  function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, i) => {
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.02;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
      if (p.life <= 0) particles.splice(i, 1);
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  animate();

  let count = 0;
  const interval = setInterval(() => {
    createFirework();
    count++;
    if (count > 20) clearInterval(interval);
  }, 300);
}
</script>

</body>
</html>
